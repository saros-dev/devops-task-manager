apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskmanager
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: backend=sarosdev/taskmanager-backend
    argocd-image-updater.argoproj.io/backend.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main

spec:
  project: default

  source:
    repoURL: https://github.com/saros-dev/devops-task-manager.git
    targetRevision: main
    path: k8s/helm/taskmanager
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: taskmanager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
