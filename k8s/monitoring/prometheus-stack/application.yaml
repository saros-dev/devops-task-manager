apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 57.2.0

    helm:
      skipCrds: true   # 🔥 مهم‌ترین fix
      values: |
        prometheusOperator:
          admissionWebhooks:
            enabled: false

        kube-state-metrics:
          enabled: false
      
        kubeStateMetrics:
          enabled: false



        grafana:
          enabled: true

        prometheus:
          prometheusSpec:
            retention: 1d

        alertmanager:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
