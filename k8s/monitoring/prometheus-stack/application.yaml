apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 58.0.0

    helm:
      values: |
        # 🚫 Disable admission webhooks (fix stuck jobs + CRD issues)
        admissionWebhooks:
          enabled: false

        prometheusOperator:
          admissionWebhooks:
            enabled: false
            patch:
              enabled: false

        # 🚀 DEV MODE: keep only core monitoring
        kube-state-metrics:
          enabled: false   # <<< مهم‌ترین fix تو

        grafana:
          enabled: true

        prometheus:
          prometheusSpec:
            retention: 2d   # سبک‌تر از 7d برای dev

        alertmanager:
          enabled: false   # optional (برای dev خاموشش کن)

        nodeExporter:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
