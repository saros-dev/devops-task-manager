apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 58.0.0

    helm:
      values: |
        # 🚫 Disable everything that needs webhooks (fix stuck jobs)
        admissionWebhooks:
          enabled: false

        prometheusOperator:
          admissionWebhooks:
            enabled: false
            patch:
              enabled: false

        # ❌ disable components that are failing image pulls
        kube-state-metrics:
          enabled: false

        nodeExporter:
          enabled: false

        alertmanager:
          enabled: false

        # ✅ keep only core prometheus
        prometheus:
          prometheusSpec:
            retention: 2d
            resources:
              requests:
                memory: 200Mi
                cpu: 100m

        # ✅ keep grafana only
        grafana:
          enabled: true
          image:
            tag: 10.4.0

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
