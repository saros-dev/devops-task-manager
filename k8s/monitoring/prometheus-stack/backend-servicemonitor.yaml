apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: monitoring
  labels:
    release: monitoring   # 👈 این مهمه
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - taskmanager
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 10s
