name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  update-manifest:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Get image tag from CI
      - name: Extract image tag
        run: |
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      # 3. Create new branch
      - name: Create branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          BRANCH="ci/update-image-${IMAGE_TAG}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          git checkout -b $BRANCH

      # 4. Update Helm values (NO sed global replace bug)
      - name: Update Helm image tag
        run: |
          sed -i "s|tag: .*|tag: \"${IMAGE_TAG}\"|g" k8s/helm/taskmanager/values.yaml

      # 5. Commit changes (IMPORTANT: skip CI loop)
      - name: Commit changes
        run: |
          git add k8s/helm/taskmanager/values.yaml

          git commit -m "ci: update image tag to ${IMAGE_TAG} [skip ci]" || echo "No changes"

      # 6. Push branch
      - name: Push branch
        run: |
          git push origin $BRANCH

      # 7. Create Pull Request
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "ci: update image tag ${IMAGE_TAG}" \
            --body "Automated PR from CD pipeline (GitOps)" \
            --base main \
            --head $BRANCH || echo "PR already exists"
