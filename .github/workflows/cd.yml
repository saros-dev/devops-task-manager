name: CD Pipeline (GitOps)

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  update-manifest:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set IMAGE_TAG
        run: |
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Create branch
        run: |
          BRANCH="ci/update-image-${IMAGE_TAG}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git checkout -b $BRANCH

      - name: Update Helm image tag
        run: |
          sed -i "s|tag: .*|tag: \"${IMAGE_TAG}\"|g" k8s/helm/taskmanager/values.yaml

      - name: Check changes
        run: |
          git diff --quiet && echo "NO_CHANGE=true" >> $GITHUB_ENV || echo "NO_CHANGE=false" >> $GITHUB_ENV

      - name: Commit changes
        if: env.NO_CHANGE == 'false'
        run: |
          git add k8s/helm/taskmanager/values.yaml
          git commit -m "chore: update image ${IMAGE_TAG}"

      - name: Push branch
        if: env.NO_CHANGE == 'false'
        run: |
          git push origin $BRANCH

      - name: Create PR
        if: env.NO_CHANGE == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "deploy: ${IMAGE_TAG}" \
            --body "auto deploy via ArgoCD GitOps" \
            --base main \
            --head $BRANCH || echo "PR exists"
