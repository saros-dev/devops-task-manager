name: CI-CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Build backend (Maven)
      - name: Build Application
        run: mvn -f backend/taskmanager/pom.xml clean package -DskipTests

      # 4. Docker login
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Setup Buildx (MULTI ARCH - خیلی مهم)
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Build & Push Multi-Arch Image
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: backend/taskmanager
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            sarosdev/taskmanager-backend:${{ github.sha }}

      # 7. Update Helm values (GitOps core step)
      - name: Update Helm image tag
        run: |
          IMAGE_TAG=${{ github.sha }}

          echo "Setting image tag: $IMAGE_TAG"

          sed -i "s|tag: .*|tag: \"$IMAGE_TAG\"|g" k8s/helm/taskmanager/values.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/helm/taskmanager/values.yaml

          git commit -m "ci: update image tag to $IMAGE_TAG [skip ci]" || echo "No changes"

          git push

  # 8. فقط برای چک (اختیاری)
  verify:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Echo success
        run: echo "CD pipeline finished successfully"
