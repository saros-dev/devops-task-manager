name: CD Pipeline (GitOps Digest Safe)

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  update-manifest:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get IMAGE DIGEST
        run: |
          echo "DIGEST=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Create Branch
        run: |
          BRANCH="ci/update-image-${DIGEST}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git checkout -b $BRANCH

      # 🔥 IMPORTANT: update digest, NOT tag
      - name: Update Helm (DIGEST)
        run: |
          FILE=k8s/helm/taskmanager/values.yaml

          sed -i "s|digest:.*|digest: \"${DIGEST}\"|g" $FILE

      - name: Commit
        run: |
          git add k8s/helm/taskmanager/values.yaml
          git commit -m "chore: update image digest ${DIGEST} [skip ci]" || echo "no changes"

      - name: Push branch
        run: |
          git push origin $BRANCH

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "deploy image ${DIGEST}" \
            --body "auto deploy via GitOps digest-based pipeline" \
            --base main \
            --head $BRANCH \
          || echo "PR exists"
