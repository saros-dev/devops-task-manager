name: CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "k8s/helm/**"

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Update values.yaml
        run: |
          sed -i "s|tag: .*|tag: \"${IMAGE_TAG}\"|g" k8s/helm/taskmanager/values.yaml

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/helm/taskmanager/values.yaml

          git commit -m "ci: update image tag ${IMAGE_TAG} [skip ci]" || echo "no changes"

      - name: Push changes
        run: git push origin main
