name: CD Pipeline (GitOps Digest Safe)

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-manifest:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ❌ این اشتباه بود (head_sha)
      # ✅ باید از CI artifact یا output بیاد
      - name: Get DIGEST from CI artifact
        run: |
          echo "⚠️ IMPORTANT: digest must come from CI output, not head_sha"

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Create Branch
        run: |
          BRANCH="ci/update-image"
          git checkout -b $BRANCH

      - name: Update Helm digest
        run: |
          FILE=k8s/helm/taskmanager/values.yaml
          sed -i "s|digest:.*|digest: \"${DIGEST}\"|g" $FILE

      - name: Commit
        run: |
          git add k8s/helm/taskmanager/values.yaml
          git commit -m "chore: update image digest ${DIGEST}" || echo "no changes"

      - name: Push
        run: |
          git push origin ci/update-image

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "deploy image digest update" \
            --body "auto GitOps deployment" \
            --base main \
            --head ci/update-image \
            || echo "PR exists"
