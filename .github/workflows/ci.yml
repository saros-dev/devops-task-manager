name: CI Pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "k8s/helm/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Maven
        run: mvn -f backend/taskmanager/pom.xml clean package -DskipTests

      # 🔥 مهم: enable multi-arch
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🐳 MULTI-ARCH BUILD + PUSH + DIGEST
      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend/taskmanager
          push: true
          platforms: linux/amd64,linux/arm64
          tags: sarosdev/taskmanager-backend:${{ github.sha }}

      # 🔐 Digest واقعی
      - name: Export digest
        run: echo "DIGEST=${{ steps.build.outputs.digest }}" >> $GITHUB_ENV

      - name: Show digest
        run: echo $DIGEST
