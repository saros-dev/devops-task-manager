name: CI Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/helm/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: mvn -f backend/taskmanager/pom.xml clean package -DskipTests

      - name: Docker Build Verification
        run: |
          docker build -t taskmanager-backend:ci backend/taskmanager
