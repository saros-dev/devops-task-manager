name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test
        run: mvn -f backend/taskmanager/pom.xml test

      - name: Build
        run: mvn -f backend/taskmanager/pom.xml clean package -DskipTests
