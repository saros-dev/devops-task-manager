name: CI Pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "k8s/helm/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Maven
        run: mvn -f backend/taskmanager/pom.xml clean package -DskipTests

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🐳 BUILD + PUSH (TAG + DIGEST)
      - name: Build & Push Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-backend:${{ github.sha }}

          docker build -t $IMAGE backend/taskmanager
          docker push $IMAGE

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE)

          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
