name: CI Pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "k8s/**"
      - ".github/workflows/cd.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: mvn -f backend/taskmanager/pom.xml clean package -DskipTests

      - name: Docker build
        run: echo "CI only - no push to git"
