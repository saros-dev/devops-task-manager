stages:
  - test
  - build
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository

# ---------------- TEST ----------------
test:
  image: maven:3.9-eclipse-temurin-21
  stage: test
  script:
    - cd backend/taskmanager
    - mvn test

# ---------------- BUILD ----------------
build:
  image: maven:3.9-eclipse-temurin-21
  stage: build
  script:
    - cd backend/taskmanager
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - backend/taskmanager/target/*.jar

# ---------------- DOCKER BUILD ----------------
docker-build:
  image: docker:latest
  stage: docker
  services:
    - docker:dind
  script:
    - docker build -t taskmanager-backend ./backend/taskmanager
